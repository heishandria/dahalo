# Export web automatique : à chaque push sur main, GitHub lance Godot sur ses serveurs,
# exporte le jeu (preset « Web ») et le publie sur GitHub Pages.
# Prérequis (une seule fois) : Settings > Pages > Source = « GitHub Actions ».
name: Export web et publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"   # doit correspondre à la version de Godot utilisée sur le PC

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Installer Godot et les modèles d'export
        run: |
          V="${GODOT_VERSION}-stable"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          wget -q "${BASE}/Godot_v${V}_linux.x86_64.zip"
          wget -q "${BASE}/Godot_v${V}_export_templates.tpz"
          unzip -q "Godot_v${V}_linux.x86_64.zip"
          sudo mv "Godot_v${V}_linux.x86_64" /usr/local/bin/godot
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          unzip -q "Godot_v${V}_export_templates.tpz"
          mv templates/* "$DEST/"
          godot --version

      - name: Importer le projet
        run: timeout 300 godot --headless --editor --quit || true

      - name: Exporter (Web)
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html

      - name: Test de fumée (partie accélérée, erreurs remontées en annotations)
        run: |
          timeout 600 godot --headless --path . -- --accelerer > test.log 2>&1 || true
          echo "Lignes de log : $(wc -l < test.log)"
          grep -E "SCRIPT ERROR|Parse Error|ERROR:|WARNING:|at: |Invalid|Cannot|Nonexistent|Attempt to" test.log | sort | uniq -c | sort -rn | head -60 > erreurs.txt || true
          if [ -s erreurs.txt ]; then
            echo "::warning title=Erreurs au test de fumée::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' erreurs.txt | cut -c1-60000)"
          else
            echo "::notice title=Test de fumée::Aucune erreur détectée ($(wc -l < test.log) lignes de log)"
          fi
          if grep -qF "[test] t=" test.log; then
            echo "::notice title=Rapport de partie::$(grep -F '[test]' test.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          tail -5 test.log

      - name: Captures d'écran (écran virtuel, rendu Compatibility comme le Web)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          DOSSIER="$PWD/build/web/captures"
          mkdir -p "$DOSSIER"
          timeout 900 xvfb-run -a -s "-screen 0 1600x900x24" \
            godot --path . --rendering-method gl_compatibility --audio-driver Dummy -- --graine=1 --captures="$DOSSIER" \
            > captures.log 2>&1 || true
          grep -F "[captures]" captures.log || tail -20 captures.log
          # Galerie : https://heishandria.github.io/dahalo/captures/
          {
            echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">'
            echo "<title>Dahalo : captures</title><body style=\"background:#222;color:#eee;font-family:sans-serif\">"
            echo "<h1>Captures automatiques</h1><p>Commit ${GITHUB_SHA::7}, $(date -u '+%d/%m/%Y %H:%M') UTC</p>"
            for f in "$DOSSIER"/*.png; do
              [ -e "$f" ] || continue
              n=$(basename "$f")
              echo "<h2>${n%.png}</h2><a href=\"$n\"><img src=\"$n\" style=\"max-width:100%\"></a>"
            done
          } > "$DOSSIER/index.html"
          echo "::notice title=Captures::$(ls "$DOSSIER"/*.png 2>/dev/null | wc -l) images, publiées dans /captures/"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: build/web/captures
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publication:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
